{% macro item_row(chave='', quantidade=1, unidade='dose') %}
<div class="item-row">
  <input type="text" name="chave" list="lista-alimentos" value="{{ chave }}"
         placeholder="Escreve o alimento…" autocomplete="off" required>
  <input type="number" name="quantidade" value="{{ quantidade }}" min="0.5" step="0.5" required>
  <select name="unidade">
    {% for u in unit_order %}
      <option value="{{ u }}" {{ 'selected' if u==unidade }}>{{ unit_labels[u] }}</option>
    {% endfor %}
  </select>
  <button type="button" class="btn-remove" onclick="removerLinha(this)" title="Remover">✕</button>
</div>
{% endmacro %}
