{% extends "base_organic.html" %}

{% block titulo %}Editar receita · NutriApp{% endblock %}
{% block cabecalho %}✏️ Editar receita{% endblock %}
{% block subcabecalho %}As calorias recalculam ao guardar{% endblock %}

{% block conteudo %}

<a href="{{ url_for('receitas') }}" style="display:inline-block;font-size:13px;font-weight:700;">← Voltar às receitas</a>

<form method="post" class="card-lg stack">
  <div class="field">
    <label>Título da receita</label>
    <input type="text" name="nome" value="{{ receita.nome }}" required>
  </div>
  <div class="field">
    <label>Ingredientes (um por linha)</label>
    <textarea name="ingredientes" required style="min-height:110px;">{{ receita.ingredientes|join('\n') }}</textarea>
  </div>
  <div class="field">
    <label>Preparo (um passo por linha)</label>
    <textarea name="preparo" required style="min-height:110px;">{{ receita.preparo|join('\n') }}</textarea>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Guardar alterações</button>
</form>

<form method="post" action="{{ url_for('remover_receita', page_id=receita.page_id) }}">
  <button class="btn btn-danger btn-block" type="submit">🗑️ Remover esta receita</button>
</form>

{% endblock %}
