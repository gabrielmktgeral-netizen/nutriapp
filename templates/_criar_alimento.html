<div class="card" style="margin-top:14px;">
  <button type="button" class="btn btn-sm btn-outline" onclick="document.getElementById('form-novo-alimento').classList.toggle('hidden-form')">
    ➕ Não encontraste o alimento? Cria um novo
  </button>
  <form method="post" action="{{ url_for('criar_alimento') }}" id="form-novo-alimento" class="hidden-form" style="margin-top:12px;">
    <input type="hidden" name="next" value="{{ request.full_path }}">
    <div class="field">
      <label>Nome do alimento</label>
      <input type="text" name="nome" placeholder="Ex: Barrita proteica X" required>
    </div>
    <p class="subtitle" style="font-size:0.85rem;">Valores por 100g:</p>
    <div class="macro-grid">
      <div class="field"><label>🔥 Kcal</label><input type="number" name="kcal" step="0.1" min="0" required></div>
      <div class="field"><label>🥩 Proteína (g)</label><input type="number" name="proteina" step="0.1" min="0" required></div>
      <div class="field"><label>🍚 Hidratos (g)</label><input type="number" name="hidratos" step="0.1" min="0" required></div>
      <div class="field"><label>🥑 Gordura (g)</label><input type="number" name="gordura" step="0.1" min="0" required></div>
    </div>
    <button class="btn btn-sm" type="submit" style="margin-top:8px;">Guardar alimento</button>
  </form>
  <a href="{{ url_for('gerir_alimentos') }}" style="display:inline-block; margin-top:10px; font-size:0.85rem;">🥕 Ver/editar todos os alimentos</a>
</div>
<style>.hidden-form { display:none; }</style>
